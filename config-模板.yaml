llm:
  enabled: true
  provider: openai_compatible
  base_url: https://opencode.ai/zen/go/v1
  chat_completions_path: /chat/completions
  user_agent: AutoAirtest/1.0
  api_key_env: OPENCODE_GO_API_KEY
  api_key: ""
  model: deepseek-v4-flash
  temperature: 0.1
  max_retries: 0
  retry_backoff_seconds: 0.25
  timeout_seconds: 180
  stream: true
  stream_include_usage: true
  use_for_planning: true
  use_for_verification: true
  response_format_json: true
  system_prompt: 你是移动 App 测试结果初判助手。只输出符合 schema 的 JSON。

device:
  platform: android_real_device
  adb_serial: "你的设备序列号"
  unlock_before_run: true

app:
  package: com.hexin.plat.android.ZhongyuanSecurity

execution:
  mode: device

input:
  excel_path: docs/test_1.xlsx
  sheet_name: 需求测试报告
