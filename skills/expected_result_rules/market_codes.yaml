# 证券 A 股市场代码前缀规则
# 用于验证测试过程中跳转到的市场页面对应的股票代码前缀是否匹配
markets:
  - name: 上证A股
    prefixes:
      - "600"
      - "601"
  - name: 深圳A股
    prefixes:
      - "00"
  - name: 北证A股
    prefixes:
      - "920"
  - name: 科创板
    prefixes:
      - "688"
      - "689"
  - name: 创业板
    prefixes:
      - "300"

# 验证规则说明
rules:
  prefix_match: "股票代码以指定前缀开头即视为属于该市场"
  note: "00 前缀包含中小板 002*，如需要精准区分深圳主板和中小板，需额外业务规则"
