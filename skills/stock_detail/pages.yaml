# 个股详情页多入口路由
# route 中的 node 必须引用 skills/navigation/nodes.yaml 中的稳定节点 ID。
version: 1
schema: stock_detail_entry_routes
source: ../../中原个股分时页.md

target_page:
  page_id: stock_fenshi
  text: 个股分时页
  aliases:
    - 个股详情页
    - 股票详情页
    - 分时页

entries:
  market_a_share_list:
    description: 从行情-A股-沪深京的股票列表进入个股分时页
    route:
      - node: market
      - node: market_quotes
      - node: market_a_share
      - node: cn_a_market
      - action: tap_stock_item

  market_individual_stock_list:
    description: 从行情-其他-个股的分类列表进入个股分时页
    route:
      - node: market
      - node: market_quotes
      - node: market_other
      - node: individual_stock
      - action: tap_stock_item

  market_search:
    description: 从行情搜索股票代码或名称后进入个股分时页
    route:
      - node: market
      - node: market_search
      - action: input_stock_keyword
      - action: tap_search_result

  home_search:
    description: 从首页搜索股票代码或名称后进入个股分时页
    route:
      - node: home
      - node: home_search
      - action: input_stock_keyword
      - action: tap_search_result

  home_watchlist:
    description: 从首页自选股票列表进入个股分时页
    route:
      - node: home
      - action: tap_watchlist_stock_item

  trade_position:
    description: 从普通交易持仓列表进入个股分时页
    route:
      - node: trade
      - node: normal_trade
      - action: tap_position_stock_item
