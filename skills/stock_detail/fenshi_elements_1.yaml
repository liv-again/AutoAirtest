# 个股分时页元素定义
# 每个元素描述"在哪里"和"怎么找到它"，供 planner 生成定位策略、executor 执行 Poco 操作。
#
# 标记约定：
#   [待确认] — 文字/content_desc/resource_id 需在真机上验证
#   [版本依赖] — 依赖特定 App 版本的 resource-id
#
version: 1
schema: stock_detail_elements
page_id: stock_fenshi
resolution: 1080x2376

elements:

  # ═══════════════════════════════════════════
  # 1. 顶部信息栏 (header)
  # ═══════════════════════════════════════════

  stock_name:
    text: ""                         # 动态内容，显示当前股票名
    aliases: [股票名称, 名称]
    locator: { type: resource_id, value: stock_name_text }  # [待确认]
    region: header
    description: 个股名称，如"贵州茅台"

  stock_code:
    text: ""                         # 动态内容，显示当前股票代码
    aliases: [股票代码, 代码]
    locator: { type: resource_id, value: stock_code_text }  # [待确认]
    region: header
    description: 个股代码，如"600519"

  current_price:
    text: ""                         # 动态，如 "1768.00"
    aliases: [当前价, 最新价, 现价]
    locator: { type: resource_id, value: current_price_text }  # [待确认]
    region: header
    description: 当前成交价格

  price_change:
    text: ""                         # 动态，如 "+2.35%"
    aliases: [涨跌幅, 涨跌]
    locator: { type: resource_id, value: price_change_text }  # [待确认]
    region: header
    description: 涨跌幅百分比

  back_button:
    text: ""
    aliases: [返回, 退出]
    locator: { type: content_desc, value: 返回 }  # [待确认]
    region: header
    description: 左上角返回按钮（纯图标，无文字）

  refresh_button:
    text: ""
    aliases: [刷新]
    locator: { type: content_desc, value: 刷新 }  # [待确认]
    region: header
    description: 右上角刷新按钮

  search_button:
    text: ""
    aliases: [搜索, 个股搜索]
    locator: { type: content_desc, value: 搜索 }  # [待确认]
    region: header
    description: 搜索图标

  # ═══════════════════════════════════════════
  # 2. 图表类型切换 Tab (chart_tabs)
  # 纯图标，无文字标签
  # ═══════════════════════════════════════════

  tab_fenshi:
    text: 分时
    aliases: [分时图, 分时线]
    locator: { type: text, value: 分时 }
    region: chart_tabs
    description: 分时图 Tab（默认选中状态）
    position_hint: 图表区域左上角第 1 个

  tab_fiveday:
    text: 五日
    aliases: [五日图, 五日线]
    locator: { type: text, value: 五日 }
    region: chart_tabs
    description: 五日走势图 Tab
    position_hint: 图表区域左上角第 2 个

  tab_daily_k:
    text: 日K
    aliases: [日K线, 日线, K线, K线图]
    locator: { type: text, value: 日K }
    region: chart_tabs
    description: 日K线图 Tab
    position_hint: 图表区域左上角第 3 个

  tab_weekly_k:
    text: 周K
    aliases: [周K线, 周线]
    locator: { type: text, value: 周K }
    region: chart_tabs
    description: 周K线图 Tab
    position_hint: 图表区域左上角第 4 个

  tab_monthly_k:
    text: 月K
    aliases: [月K线, 月线]
    locator: { type: text, value: 月K }
    region: chart_tabs
    description: 月K线图 Tab
    position_hint: 图表区域左上角第 5 个

  tab_minute_k:
    text: ""
    aliases: [分钟K, 分钟, 更多周期]
    locator: { type: text, value: "" }  # [待确认] 可能是图标或下拉
    region: chart_tabs
    description: 更多周期选择（1分/5分/15分/30分/60分等）
    position_hint: 图表区域左上角最后一项

  # ═══════════════════════════════════════════
  # 3. 指标切换 Tab (indicator_tabs)
  # 位于图表下方，人为命名较多
  # ═══════════════════════════════════════════

  indicator_volume:
    text: 成交量          # [待确认] 缩写可能是"量"或"VOL"
    aliases: [量, 成交量, VOL, 量能]
    locator: { type: text, value: 成交量 }
    region: indicator_tabs
    description: 成交量指标

  indicator_macd:
    text: MACD
    aliases: [macd, MACD指标]
    locator: { type: text, value: MACD }
    region: indicator_tabs
    description: MACD 指标

  indicator_kdj:
    text: KDJ
    aliases: [kdj, KDJ指标]
    locator: { type: text, value: KDJ }
    region: indicator_tabs
    description: KDJ 指标

  indicator_rsi:
    text: RSI
    aliases: [rsi, RSI指标]
    locator: { type: text, value: RSI }
    region: indicator_tabs
    description: RSI 指标

  indicator_more:
    text: ""
    aliases: [更多指标, 指标设置, 全部指标]
    locator: { type: content_desc, value: 更多指标 }  # [待确认]
    region: indicator_tabs
    description: 展开更多指标选择

  # ═══════════════════════════════════════════
  # 4. 盘口区 (order_book)
  # 买卖五档挂单，结构化数据
  # ═══════════════════════════════════════════

  buy_five:
    text: 买五
    aliases: [买五价, 买五量]
    locator: { type: text, value: 买五 }
    region: order_book
    description: 买五档：价格+挂单量

  buy_four:
    text: 买四
    aliases: [买四价, 买四量]
    locator: { type: text, value: 买四 }
    region: order_book
    description: 买四档

  buy_three:
    text: 买三
    aliases: [买三价, 买三量]
    locator: { type: text, value: 买三 }
    region: order_book
    description: 买三档

  buy_two:
    text: 买二
    aliases: [买二价, 买二量]
    locator: { type: text, value: 买二 }
    region: order_book
    description: 买二档

  buy_one:
    text: 买一
    aliases: [买一价, 买一量, 买盘]
    locator: { type: text, value: 买一 }
    region: order_book
    description: 买一档：最优买价

  sell_one:
    text: 卖一
    aliases: [卖一价, 卖一量, 卖盘]
    locator: { type: text, value: 卖一 }
    region: order_book
    description: 卖一档：最优卖价

  sell_two:
    text: 卖二
    aliases: [卖二价, 卖二量]
    locator: { type: text, value: 卖二 }
    region: order_book
    description: 卖二档

  sell_three:
    text: 卖三
    aliases: [卖三价, 卖三量]
    locator: { type: text, value: 卖三 }
    region: order_book
    description: 卖三档

  sell_four:
    text: 卖四
    aliases: [卖四价, 卖四量]
    locator: { type: text, value: 卖四 }
    region: order_book
    description: 卖四档

  sell_five:
    text: 卖五
    aliases: [卖五价, 卖五量]
    locator: { type: text, value: 卖五 }
    region: order_book
    description: 卖五档

  open_price:
    text: 开盘
    aliases: [开盘价, 今开]
    locator: { type: text, value: 开盘 }
    region: order_book
    description: 今日开盘价

  yesterday_close:
    text: 昨收
    aliases: [昨收价, 昨日收盘, 前收盘]
    locator: { type: text, value: 昨收 }
    region: order_book
    description: 昨日收盘价

  high_price:
    text: 最高
    aliases: [最高价, 今日最高]
    locator: { type: text, value: 最高 }
    region: order_book
    description: 今日最高价

  low_price:
    text: 最低
    aliases: [最低价, 今日最低]
    locator: { type: text, value: 最低 }
    region: order_book
    description: 今日最低价

  turnover_volume:
    text: 成交量
    aliases: [成交, 总手, 成交量数据]
    locator: { type: text, value: 成交量 }
    region: order_book
    description: 成交总量（手）

  turnover_amount:
    text: 成交额
    aliases: [成交额, 总金额]
    locator: { type: text, value: 成交额 }
    region: order_book
    description: 成交总金额（元）

  # ═══════════════════════════════════════════
  # 5. 底部功能 Tab (bottom_tabs)
  # ═══════════════════════════════════════════

  bottom_tab_capital:
    text: 资金
    aliases: [资金流向, 主力资金, 资金明细]
    locator: { type: text, value: 资金 }
    region: bottom_tabs
    description: 资金流向页面
    position_hint: 底部 Tab 第 1 个

  bottom_tab_news:
    text: 新闻           # [待确认] 可能是"资讯"或"新闻"
    aliases: [新闻, 资讯, 公告]
    locator: { type: text, value: 新闻 }
    region: bottom_tabs
    description: 个股相关新闻/资讯
    position_hint: 底部 Tab 第 2 个

  bottom_tab_brief:
    text: 简况
    aliases: [简况, 概况, 详情, F10]
    locator: { type: text, value: 简况 }
    region: bottom_tabs
    description: 个股简况/F10
    position_hint: 底部 Tab 第 3 个

  bottom_tab_discuss:
    text: 讨论
    aliases: [讨论, 社区, 评论区]
    locator: { type: text, value: 讨论 }
    region: bottom_tabs
    description: 个股讨论区
    position_hint: 底部 Tab 第 4 个

  # ═══════════════════════════════════════════
  # 6. 底部操作按钮 (action_buttons)
  # ═══════════════════════════════════════════

  btn_buy:
    text: 买入
    aliases: [买, 下单买入, 委托买入]
    locator: { type: text, value: 买入 }
    region: action_buttons
    description: 买入按钮

  btn_sell:
    text: 卖出
    aliases: [卖, 下单卖出, 委托卖出]
    locator: { type: text, value: 卖出 }
    region: action_buttons
    description: 卖出按钮

  btn_add_watchlist:
    text: ""
    aliases: [加自选, 添加自选, 自选]
    locator: { type: content_desc, value: 加自选 }  # [待确认] 可能是图标
    region: action_buttons
    description: 加自选按钮（纯图标）

  # ═══════════════════════════════════════════
  # 7. 其他数据字段 (data_fields)
  # ═══════════════════════════════════════════

  turnover_rate:
    text: 换手率
    aliases: [换手率, 换手]
    locator: { type: text, value: 换手率 }
    region: data_fields
    description: 换手率

  volume_ratio:
    text: 量比
    aliases: [量比, 成交比]
    locator: { type: text, value: 量比 }
    region: data_fields
    description: 量比

  pe_ratio:
    text: 市盈率
    aliases: [市盈率, PE, 市盈]
    locator: { type: text, value: 市盈率 }
    region: data_fields
    description: 市盈率（动/静）[待确认显示格式]

  market_cap:
    text: 总市值
    aliases: [市值, 总市值, 流通市值]
    locator: { type: text, value: 总市值 }
    region: data_fields
    description: 总市值（元）

  amplitude:
    text: 振幅
    aliases: [振幅, 波动幅度]
    locator: { type: text, value: 振幅 }
    region: data_fields
    description: 今日振幅

  limit_up:
    text: 涨停
    aliases: [涨停价, 涨停板]
    locator: { type: text, value: 涨停 }
    region: data_fields
    description: 今日涨停价

  limit_down:
    text: 跌停
    aliases: [跌停价, 跌停板]
    locator: { type: text, value: 跌停 }
    region: data_fields
    description: 今日跌停价
