# 个股分时页元素定义
# 使用稳定 element ID、单父节点层级和有序定位器，格式风格与 skills/navigation 保持一致。
version: 1
schema: stock_detail_page_elements
source: ../../中原个股分时页.md
page_id: stock_fenshi

roots:
  - title_bar
  - quote_headline
  - express
  - after_hours_trade
  - chart_switch
  - detail
  - news
  - order_book
  - announcement
  - f10_summary
  - finance
  - research_report
  - bottom_navigation

elements:
  title_bar:
    text: 标题栏
    parent: null
    aliases: []
    children: [title_back, title_search]
    locators: []
    description: 页面顶部标题栏

  title_back:
    text: 返回
    parent: title_bar
    aliases: [返回按钮]
    children: []
    locators:
      - type: resource_id
        value: id/backButton
    description: 标题栏返回图标

  title_search:
    text: 搜索
    parent: title_bar
    aliases: [搜索按钮, 个股搜索]
    children: []
    locators:
      - type: resource_id
        value: id/navi_title_right
    description: 标题栏右侧搜索图标

  quote_headline:
    text: 简报价头
    parent: null
    aliases: [报价头, 行情头]
    children: []
    locators:
      - type: resource_id
        value: id/fenshi_headline_view
    description: 个股分时页简报价头区域

  express:
    text: 速递
    parent: null
    aliases: [速递栏]
    children: [express_title, express_close]
    locators: []
    description: 速递信息区域

  express_title:
    text: 速递标题
    parent: express
    aliases: [速递内容]
    children: []
    locators:
      - type: resource_id
        value: id/tv_express_content
    description: 速递区域标题或内容文本

  express_close:
    text: 关闭按钮
    parent: express
    aliases: [关闭速递, 关闭]
    children: []
    locators:
      - type: resource_id
        value: id/iv_express_close
    description: 速递区域关闭图标

  after_hours_trade:
    text: 盘后固定交易
    parent: null
    aliases: [盘后交易]
    children: [after_hours_expand]
    locators: []
    description: 盘后固定交易区域

  after_hours_expand:
    text: 展开
    parent: after_hours_trade
    aliases: [展开盘后固定交易]
    children: []
    locators:
      - type: resource_id
        value: id/img_open
      - type: content_desc
        value: 展开
    description: 展开盘后固定交易的图标

  chart_switch:
    text: 分时切换
    parent: null
    aliases: [图表切换, 周期切换]
    children:
      - chart_fenshi
      - chart_daily_k
      - chart_weekly_k
      - chart_monthly_k
      - chart_five_day
      - chart_more
      - chart_settings
    locators: []
    description: 分时和 K 线周期切换区域

  chart_fenshi:
    text: 分时
    parent: chart_switch
    aliases: [分时图]
    children: []
    locators:
      - type: text
        value: 分时
    description: 切换到分时图

  chart_daily_k:
    text: 日K
    parent: chart_switch
    aliases: [日K线, 日线]
    children: []
    locators:
      - type: text
        value: 日K
    description: 切换到日 K 图

  chart_weekly_k:
    text: 周K
    parent: chart_switch
    aliases: [周K线, 周线]
    children: []
    locators:
      - type: text
        value: 周K
    description: 切换到周 K 图

  chart_monthly_k:
    text: 月K
    parent: chart_switch
    aliases: [月K线, 月线]
    children: []
    locators:
      - type: text
        value: 月K
    description: 切换到月 K 图

  chart_five_day:
    text: 五日
    parent: chart_switch
    aliases: [五日分时, 五日图]
    children: []
    locators:
      - type: text
        value: 五日
    description: 切换到五日分时图

  chart_more:
    text: 更多
    parent: chart_switch
    aliases: [更多周期]
    children:
      - chart_120_minute
      - chart_60_minute
      - chart_30_minute
      - chart_15_minute
      - chart_5_minute
      - chart_1_minute
      - chart_yearly_k
      - chart_quarterly_k
    locators:
      - type: text
        value: 更多
    description: 展开更多 K 线周期

  chart_120_minute:
    text: 120分
    parent: chart_more
    aliases: [120分钟, 120分K]
    children: []
    locators:
      - type: text
        value: 更多
    description: 选择 120 分钟 K 线
    source_note: 源文档中“120分”的 text 记录为“更多”，与父级“更多”重复，需真机核验。

  chart_60_minute:
    text: 60分
    parent: chart_more
    aliases: [60分钟, 60分K]
    children: []
    locators:
      - type: text
        value: 60分
    description: 选择 60 分钟 K 线

  chart_30_minute:
    text: 30分
    parent: chart_more
    aliases: [30分钟, 30分K]
    children: []
    locators:
      - type: text
        value: 30分
    description: 选择 30 分钟 K 线

  chart_15_minute:
    text: 15分
    parent: chart_more
    aliases: [15分钟, 15分K]
    children: []
    locators:
      - type: text
        value: 30分
    description: 选择 15 分钟 K 线
    source_note: 源文档中“15分”的 text 记录为“30分”，与 30 分钟条目重复，需真机核验。

  chart_5_minute:
    text: 5分
    parent: chart_more
    aliases: [5分钟, 5分K]
    children: []
    locators:
      - type: text
        value: 5分
    description: 选择 5 分钟 K 线

  chart_1_minute:
    text: 1分
    parent: chart_more
    aliases: [1分钟, 1分K]
    children: []
    locators:
      - type: text
        value: 1分
    description: 选择 1 分钟 K 线

  chart_yearly_k:
    text: 年K
    parent: chart_more
    aliases: [年K线, 年线]
    children: []
    locators:
      - type: text
        value: 年K
    description: 选择年 K 线

  chart_quarterly_k:
    text: 季K
    parent: chart_more
    aliases: [季K线, 季线]
    children: []
    locators:
      - type: text
        value: 季K
    description: 选择季 K 线

  chart_settings:
    text: 分时设置
    parent: chart_switch
    aliases: [图表设置, 设置分时]
    children: []
    locators:
      - type: resource_id
        value: id/setting
    description: 分时图设置图标

  detail:
    text: 明细
    parent: null
    aliases: [成交明细]
    children: []
    locators:
      - type: resource_id
        value: id/mxText
      - type: text
        value: 明细
    description: 成交明细入口

  news:
    text: 新闻
    parent: null
    aliases: [个股新闻]
    children: [news_item]
    locators:
      - type: text
        value: 新闻
    description: 个股新闻区域

  news_item:
    text: 新闻条目
    parent: news
    aliases: [第0条, 第一条新闻]
    children: []
    locators:
      - type: resource_id
        value: id/view_newsgroup_item
      - type: content_desc
        value: 第0条
    description: 新闻列表第一条内容

  order_book:
    text: 盘口
    parent: null
    aliases: [盘口信息]
    children: [order_book_all_changes]
    locators:
      - type: text
        value: 盘口
    description: 个股盘口区域

  order_book_all_changes:
    text: 查看全部异动
    parent: order_book
    aliases: [全部异动]
    children: []
    locators:
      - type: resource_id
        value: id/indexbar_show_value_info
      - type: text
        value: 查看全部异动
    description: 查看全部盘口异动

  announcement:
    text: 公告
    parent: null
    aliases: [个股公告]
    children:
      - announcement_more
      - announcement_all
      - announcement_performance
      - announcement_major_event
      - announcement_other
    locators:
      - type: text
        value: 公告
    description: 个股公告区域

  announcement_more:
    text: 更多
    parent: announcement
    aliases: [更多公告]
    children: []
    locators:
      - type: text
        value: 更多
    description: 展开公告分类或更多公告

  announcement_all:
    text: 全部公告
    parent: announcement
    aliases: [所有公告]
    children: []
    locators:
      - type: text
        value: 全部公告
    description: 查看全部公告

  announcement_performance:
    text: 业绩公告
    parent: announcement
    aliases: [业绩类公告]
    children: []
    locators:
      - type: text
        value: 业绩公告
    description: 查看业绩公告

  announcement_major_event:
    text: 重大事项
    parent: announcement
    aliases: [重大事项公告]
    children: []
    locators:
      - type: text
        value: 重大事项
    description: 查看重大事项公告

  announcement_other:
    text: 其他公告
    parent: announcement
    aliases: [其它公告]
    children: []
    locators:
      - type: text
        value: 其他公告
    description: 查看其他公告

  f10_summary:
    text: 简况F10
    parent: null
    aliases: [简况, F10]
    children: []
    locators:
      - type: text
        value: 简况F10
    description: 个股简况 F10 入口

  finance:
    text: 财务
    parent: null
    aliases: [财务数据]
    children: []
    locators:
      - type: text
        value: 财务
    description: 个股财务入口

  research_report:
    text: 研报
    parent: null
    aliases: [研究报告]
    children: [research_report_item]
    locators:
      - type: text
        value: 研报
    description: 个股研报区域

  research_report_item:
    text: 研报条目
    parent: research_report
    aliases: [第一条研报]
    children: []
    locators:
      - type: resource_id
        value: id/view_newsgroup_item
    description: 研报列表条目；与新闻条目共用 resource-id，需结合父级区域定位。

  bottom_navigation:
    text: 底部导航栏
    parent: null
    aliases: [底部操作栏]
    children:
      - bottom_index
      - bottom_order
      - bottom_diagnosis
      - bottom_watchlist
      - bottom_more
    locators: []
    description: 个股分时页底部导航区域

  bottom_index:
    text: 指数
    parent: bottom_navigation
    aliases: [指数按钮]
    children: [bottom_index_fenshi]
    locators:
      - type: resource_id
        value: id/indexview
      - type: position
        value: [0.11203703703703703, 0.9448653198653199]
        coordinate_system: normalized
    description: 底部指数图标；保留源文档提供的归一化坐标。

  bottom_index_fenshi:
    text: 分时图
    parent: bottom_index
    aliases: [指数分时图]
    children: []
    locators:
      - type: resource_id
        value: id/indexfenshi
    description: 指数入口中的分时图元素

  bottom_order:
    text: 下单
    parent: bottom_navigation
    aliases: [交易下单]
    children: []
    locators:
      - type: resource_id
        value: id/xiadan
    description: 底部下单图标

  bottom_diagnosis:
    text: 诊股
    parent: bottom_navigation
    aliases: [股票诊断]
    children: []
    locators:
      - type: resource_id
        value: id/zhengu
    description: 底部诊股图标

  bottom_watchlist:
    text: 加自选/减自选
    parent: bottom_navigation
    aliases: [加自选, 减自选, 自选]
    children: []
    locators:
      - type: resource_id
        value: id/ll_add_remove_zixuan
    description: 根据当前自选状态添加或移除股票

  bottom_more:
    text: 更多
    parent: bottom_navigation
    aliases: [底部更多]
    children: [bottom_more_settings]
    locators:
      - type: resource_id
        value: id/ll_more
    description: 底部更多图标

  bottom_more_settings:
    text: 设置
    parent: bottom_more
    aliases: [更多设置]
    children: []
    locators:
      - type: text
        value: 设置
    description: 底部更多菜单中的设置入口
